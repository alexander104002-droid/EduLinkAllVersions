<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Siswa Smaneka</title>
    <!-- Tailwind CSS for styling and responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX compilation in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4A90E2',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-blue-50 text-gray-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- Mock Data ---
        const menuItems = [
            { id: 1, name: 'Nasi Goreng', price: 12000, category: 'Makanan', stand: 'Stand A' },
            { id: 2, name: 'Mie Goreng', price: 10000, category: 'Makanan', stand: 'Stand A' },
            { id: 3, name: 'Es Teh Manis', price: 4000, category: 'Minuman', stand: 'Stand B' },
            { id: 4, name: 'Jus Jeruk', price: 8000, category: 'Minuman', stand: 'Stand B' },
            { id: 5, name: 'Salad Buah', price: 15000, category: 'Sehat', stand: 'Stand C' },
        ];

        const teachers = [
            { id: 1, name: 'Bpk. Ahmad Fauzi', subject: 'Matematika', phone: '0812-3456-7890', status: 'Available' },
            { id: 2, name: 'Ibu Ratna Sari', subject: 'Bahasa Inggris', phone: '0812-9876-5432', status: 'Busy' },
            { id: 3, name: 'Bpk. Budi Santoso', subject: 'Fisika', phone: '0812-5555-6666', status: 'Available' },
        ];

        // --- Components ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('Beranda');
            const [cartCount, setCartCount] = useState(0);

            const renderContent = () => {
                switch (activeTab) {
                    case 'Beranda': return <BerandaView />;
                    case 'Absen': return <AbsenView />;
                    case 'Kantin': return <KantinView cartCount={cartCount} setCartCount={setCartCount} />;
                    case 'Kontak': return <KontakView />;
                    default: return <BerandaView />;
                }
            };

            return (
                <div class="max-w-screen-xl mx-auto min-h-screen relative pb-20 md:pb-24">
                    {/* Header */}
                    <header class="bg-white p-4 shadow-sm sticky top-0 z-10 flex justify-between items-center">
                        <h1 class="text-xl font-bold text-primary">{activeTab}</h1>
                        {activeTab === 'Kantin' && (
                            <div class="bg-primary text-white px-3 py-1 rounded-full text-sm font-bold">
                                🛒 {cartCount}
                            </div>
                        )}
                    </header>

                    {/* Main Content Area */}
                    <main class="p-4">
                        {renderContent()}
                    </main>

                    {/* Bottom Navigation (Consistent across devices) */}
                    <nav class="fixed bottom-0 w-full max-w-screen-xl mx-auto bg-white border-t border-gray-200 flex justify-around p-3 pb-safe z-20 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
                        {['Beranda', 'Absen', 'Kantin', 'Kontak'].map((tab) => (
                            <button 
                                key={tab}
                                onClick={() => setActiveTab(tab)}
                                class={`flex flex-col items-center p-2 rounded-lg transition-colors w-16 md:w-24 ${activeTab === tab ? 'text-primary' : 'text-gray-400 hover:text-gray-600'}`}
                            >
                                <div class={`h-6 w-6 mb-1 rounded-md ${activeTab === tab ? 'bg-primary' : 'bg-gray-300'}`}></div>
                                <span class="text-xs md:text-sm font-medium">{tab}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        };

        const BerandaView = () => (
            <div class="space-y-4 animate-fade-in">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-2xl font-bold mb-2">Selamat Pagi!</h2>
                    <p class="text-gray-600">Jadwal hari ini: Matematika, Bahasa Indonesia, Fisika.</p>
                </div>
            </div>
        );

        const AbsenView = () => (
            <div class="flex flex-col md:flex-row gap-6 animate-fade-in">
                {/* Mobile: Top, Tablet: Side */}
                <div class="md:w-1/3 flex flex-col gap-4">
                    <button class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-8 rounded-2xl shadow-md transition-transform transform active:scale-95 text-xl flex flex-col items-center justify-center gap-2">
                        <span class="text-3xl">📱</span>
                        Scan QR Absen
                    </button>
                </div>
                {/* Calendar fills remaining space on tablet */}
                <div class="md:w-2/3 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-lg mb-4 text-gray-700">Ringkasan Kehadiran</h3>
                    <div class="grid grid-cols-7 gap-2 text-center text-sm">
                        {['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'].map(day => (
                            <div key={day} class="font-bold text-gray-400">{day}</div>
                        ))}
                        {/* Dummy Calendar Days */}
                        {Array.from({length: 30}).map((_, i) => (
                            <div key={i} class={`p-2 rounded-lg ${i % 7 === 0 ? 'text-red-400' : (i===15 ? 'bg-primary text-white font-bold' : 'text-gray-700 hover:bg-gray-100 cursor-pointer')}`}>
                                {i + 1}
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        const KantinView = ({ cartCount, setCartCount }) => {
            const [filter, setFilter] = useState('Semua');
            const categories = ['Semua', 'Makanan', 'Minuman', 'Sehat'];

            const filteredMenu = filter === 'Semua' ? menuItems : menuItems.filter(item => item.category === filter);

            return (
                <div class="animate-fade-in">
                    {/* Horizontal Scrolling Tabs (Mobile) / Standard Tabs (Tablet) */}
                    <div class="flex overflow-x-auto pb-4 mb-2 gap-2 hide-scrollbar">
                        {categories.map(cat => (
                            <button 
                                key={cat} 
                                onClick={() => setFilter(cat)}
                                class={`whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium transition-colors ${filter === cat ? 'bg-primary text-white' : 'bg-white text-gray-600 border border-gray-200'}`}
                            >
                                {cat}
                            </button>
                        ))}
                    </div>

                    {/* Responsive Grid: 1 column mobile, 3 columns tablet */}
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {filteredMenu.map(item => (
                            <div key={item.id} class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col">
                                <div class="bg-gray-200 h-32 rounded-xl mb-4 w-full flex items-center justify-center text-gray-400">
                                    [Gambar {item.name}]
                                </div>
                                <div class="flex-grow">
                                    <h4 class="font-bold text-lg text-gray-800">{item.name}</h4>
                                    <p class="text-sm text-gray-500 mb-2">{item.stand} • {item.category}</p>
                                    <p class="font-bold text-primary mb-4">Rp {item.price.toLocaleString('id-ID')}</p>
                                </div>
                                <button 
                                    onClick={() => setCartCount(c => c + 1)}
                                    class="w-full bg-blue-50 text-primary hover:bg-primary hover:text-white border border-primary font-medium py-2 rounded-xl transition-colors"
                                >
                                    + Keranjang
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const KontakView = () => (
            <div class="animate-fade-in">
                {/* Responsive Layout: Stacked on mobile, Grid on tablet */}
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {teachers.map(teacher => (
                        <div key={teacher.id} class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                            <div class="h-14 w-14 rounded-full bg-gray-300 flex-shrink-0 relative">
                                <div class={`absolute bottom-0 right-0 h-4 w-4 rounded-full border-2 border-white ${teacher.status === 'Available' ? 'bg-green-500' : 'bg-red-500'}`}></div>
                            </div>
                            <div class="flex-grow">
                                <h4 class="font-bold text-gray-800">{teacher.name}</h4>
                                <p class="text-sm text-gray-500">{teacher.subject}</p>
                                <p class="text-xs text-gray-400 mt-1">{teacher.phone}</p>
                            </div>
                            <button class="bg-green-50 text-green-600 hover:bg-green-500 hover:text-white p-3 rounded-xl transition-colors flex-shrink-0">
                                WA
                            </button>
                        </div>
                    ))}
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        /* Custom styles to hide scrollbar for horizontal tabs */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</body>
</html>
