<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Siswa Smaneka</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4A90E2',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-blue-50 text-gray-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- Data Dummy ---
        const menuItems = [
            { id: 1, name: 'Nasi Goreng', price: 12000, category: 'Makanan', stand: 'Stand A' },
            { id: 2, name: 'Mie Goreng', price: 10000, category: 'Makanan', stand: 'Stand A' },
            { id: 3, name: 'Es Teh Manis', price: 4000, category: 'Minuman', stand: 'Stand B' },
            { id: 4, name: 'Jus Jeruk', price: 8000, category: 'Minuman', stand: 'Stand B' },
            { id: 5, name: 'Salad Buah', price: 15000, category: 'Sehat', stand: 'Stand C' },
        ];

        const teachers = [
            { id: 1, name: 'Bpk. Ahmad Fauzi', subject: 'Matematika', phone: '0812-3456-7890', status: 'Available' },
            { id: 2, name: 'Ibu Ratna Sari', subject: 'Bahasa Inggris', phone: '0812-9876-5432', status: 'Busy' },
            { id: 3, name: 'Bpk. Budi Santoso', subject: 'Fisika', phone: '0812-5555-6666', status: 'Available' },
        ];

        // --- Komponen Ikon SVG (Heroicons Outline) ---
        const Icon = ({ name, className }) => {
            const svgProps = {
                xmlns: "http://www.w3.org/2000/svg",
                fill: "none",
                viewBox: "0 0 24 24",
                strokeWidth: 1.5,
                stroke: "currentColor",
                className: className || "w-6 h-6"
            };
            switch (name) {
                case 'Beranda': 
                    return <svg {...svgProps}><path strokeLinecap="round" strokeLinejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>;
                case 'Absen': 
                    return <svg {...svgProps}><path strokeLinecap="round" strokeLinejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" /></svg>;
                case 'Kantin': 
                    return <svg {...svgProps}><path strokeLinecap="round" strokeLinejoin="round" d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349m-16.5 11.65V9.35m0 0a3.001 3.001 0 003.75-.615A2.993 2.993 0 009.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 002.25 1.016c.896 0 1.7-.393 2.25-1.016a3.001 3.001 0 003.75.614m-16.5 0a3.004 3.004 0 01-.621-4.72L4.318 3.44A1.5 1.5 0 015.378 3h13.243a1.5 1.5 0 011.06.44l1.19 1.189a3 3 0 01-.621 4.72m-13.5 8.65h3.75a.75.75 0 00.75-.75V13.5a.75.75 0 00-.75-.75H6.75a.75.75 0 00-.75.75v3.75c0 .415.336.75.75.75z" /></svg>;
                case 'Kontak': 
                    return <svg {...svgProps}><path strokeLinecap="round" strokeLinejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" /></svg>;
                case 'Cart': 
                    return <svg {...svgProps}><path strokeLinecap="round" strokeLinejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" /></svg>;
                case 'QR': 
                    return <svg {...svgProps}><path strokeLinecap="round" strokeLinejoin="round" d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0 1 3.75 9.375v-4.5ZM3.75 14.625c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 0 1-1.125-1.125v-4.5ZM13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0 1 13.5 9.375v-4.5Z" /><path strokeLinecap="round" strokeLinejoin="round" d="M6.75 6.75h.75v.75h-.75v-.75ZM6.75 16.5h.75v.75h-.75v-.75ZM16.5 6.75h.75v.75h-.75v-.75ZM13.5 13.5h.75v.75h-.75v-.75ZM13.5 19.5h.75v.75h-.75v-.75ZM19.5 13.5h.75v.75h-.75v-.75ZM19.5 19.5h.75v.75h-.75v-.75ZM16.5 16.5h.75v.75h-.75v-.75Z" /></svg>;
                case 'Chat': 
                    return <svg {...svgProps}><path strokeLinecap="round" strokeLinejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z" /></svg>;
                default: 
                    return null;
            }
        };

        // --- Komponen Utama ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('Beranda');
            const [cartCount, setCartCount] = useState(0);

            const renderContent = () => {
                switch (activeTab) {
                    case 'Beranda': return <BerandaView />;
                    case 'Absen': return <AbsenView />;
                    case 'Kantin': return <KantinView cartCount={cartCount} setCartCount={setCartCount} />;
                    case 'Kontak': return <KontakView />;
                    default: return <BerandaView />;
                }
            };

            return (
                <div className="max-w-screen-xl mx-auto min-h-screen relative pb-20 md:pb-24">
                    {/* Header */}
                    <header className="bg-white p-4 shadow-sm sticky top-0 z-10 flex justify-between items-center">
                        <h1 className="text-xl font-bold text-primary">{activeTab}</h1>
                        {activeTab === 'Kantin' && (
                            <div className="bg-primary text-white px-4 py-1.5 rounded-full text-sm font-bold flex items-center gap-1.5">
                                <Icon name="Cart" className="w-4 h-4" />
                                {cartCount}
                            </div>
                        )}
                    </header>

                    {/* Main Content Area */}
                    <main className="p-4">
                        {renderContent()}
                    </main>

                    {/* Bottom Navigation */}
                    <nav className="fixed bottom-0 w-full max-w-screen-xl mx-auto bg-white border-t border-gray-200 flex justify-around p-3 pb-safe z-20 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
                        {['Beranda', 'Absen', 'Kantin', 'Kontak'].map((tab) => (
                            <button 
                                key={tab}
                                onClick={() => setActiveTab(tab)}
                                className={`flex flex-col items-center p-2 rounded-lg transition-colors w-16 md:w-24 ${activeTab === tab ? 'text-primary' : 'text-gray-400 hover:text-gray-600'}`}
                            >
                                <Icon name={tab} className="w-6 h-6 mb-1" />
                                <span className="text-xs md:text-sm font-medium">{tab}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        };

        const BerandaView = () => (
            <div className="space-y-4 animate-fade-in">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 className="text-2xl font-bold mb-2">Selamat Pagi!</h2>
                    <p className="text-gray-600">Jadwal hari ini: Matematika, Bahasa Indonesia, Fisika.</p>
                </div>
            </div>
        );

        const AbsenView = () => (
            <div className="flex flex-col md:flex-row gap-6 animate-fade-in">
                {/* Mobile: Top, Tablet: Side */}
                <div className="md:w-1/3 flex flex-col gap-4">
                    <button className="w-full bg-primary hover:bg-blue-600 text-white font-bold py-8 rounded-2xl shadow-md transition-transform transform active:scale-95 text-xl flex flex-col items-center justify-center gap-3">
                        <Icon name="QR" className="w-12 h-12" />
                        Scan QR Absen
                    </button>
                </div>
                {/* Calendar */}
                <div className="md:w-2/3 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h3 className="font-bold text-lg mb-4 text-gray-700">Ringkasan Kehadiran</h3>
                    <div className="grid grid-cols-7 gap-2 text-center text-sm">
                        {['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'].map(day => (
                            <div key={day} className="font-bold text-gray-400">{day}</div>
                        ))}
                        {Array.from({length: 30}).map((_, i) => (
                            <div key={i} className={`p-2 rounded-lg ${i % 7 === 0 ? 'text-red-400' : (i===15 ? 'bg-primary text-white font-bold shadow-md' : 'text-gray-700 hover:bg-gray-100 cursor-pointer')}`}>
                                {i + 1}
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        const KantinView = ({ cartCount, setCartCount }) => {
            const [filter, setFilter] = useState('Semua');
            const categories = ['Semua', 'Makanan', 'Minuman', 'Sehat'];

            const filteredMenu = filter === 'Semua' ? menuItems : menuItems.filter(item => item.category === filter);

            return (
                <div className="animate-fade-in">
                    {/* Tabs */}
                    <div className="flex overflow-x-auto pb-4 mb-2 gap-2 hide-scrollbar">
                        {categories.map(cat => (
                            <button 
                                key={cat} 
                                onClick={() => setFilter(cat)}
                                className={`whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium transition-colors ${filter === cat ? 'bg-primary text-white' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'}`}
                            >
                                {cat}
                            </button>
                        ))}
                    </div>

                    {/* Grid Makanan */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {filteredMenu.map(item => (
                            <div key={item.id} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col">
                                <div className="bg-gray-100 h-32 rounded-xl mb-4 w-full flex items-center justify-center text-gray-400 border border-dashed border-gray-300">
                                    [Gambar {item.name}]
                                </div>
                                <div className="flex-grow">
                                    <h4 className="font-bold text-lg text-gray-800">{item.name}</h4>
                                    <p className="text-sm text-gray-500 mb-2">{item.stand} • {item.category}</p>
                                    <p className="font-bold text-primary mb-4">Rp {item.price.toLocaleString('id-ID')}</p>
                                </div>
                                <button 
                                    onClick={() => setCartCount(c => c + 1)}
                                    className="w-full bg-blue-50 text-primary hover:bg-primary hover:text-white border border-primary font-medium py-2 rounded-xl transition-colors flex items-center justify-center gap-2"
                                >
                                    <Icon name="Cart" className="w-5 h-5" />
                                    Tambah
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const KontakView = () => (
            <div className="animate-fade-in">
                {/* Grid Kontak */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {teachers.map(teacher => (
                        <div key={teacher.id} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                            <div className="h-14 w-14 rounded-full bg-gray-200 border border-gray-300 flex-shrink-0 relative">
                                <div className={`absolute bottom-0 right-0 h-4 w-4 rounded-full border-2 border-white ${teacher.status === 'Available' ? 'bg-green-500' : 'bg-red-500'}`}></div>
                            </div>
                            <div className="flex-grow">
                                <h4 className="font-bold text-gray-800">{teacher.name}</h4>
                                <p className="text-sm text-gray-500">{teacher.subject}</p>
                                <p className="text-xs text-gray-400 mt-1">{teacher.phone}</p>
                            </div>
                            <button className="bg-green-50 text-green-600 hover:bg-green-500 hover:text-white p-3 rounded-xl transition-colors flex-shrink-0 flex items-center justify-center" aria-label="Chat WA">
                                <Icon name="Chat" className="w-6 h-6" />
                            </button>
                        </div>
                    ))}
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        /* Sembunyikan scrollbar untuk tab horizontal */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(5px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</body>
</html>
