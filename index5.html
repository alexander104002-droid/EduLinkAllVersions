<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Smaneka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#4A90E2',
                        emerald: '#10b981',
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-blue-50 text-gray-800 antialiased transition-colors duration-300 dark:bg-darkBg dark:text-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Data Dummy ---
        const menuItems = [
            { id: 1, name: 'Nasi Goreng', price: 12000, category: 'Makanan', stand: 'Stand A' },
            { id: 2, name: 'Mie Goreng', price: 10000, category: 'Makanan', stand: 'Stand A' },
            { id: 3, name: 'Es Teh Manis', price: 4000, category: 'Minuman', stand: 'Stand B' },
            { id: 4, name: 'Jus Jeruk', price: 8000, category: 'Minuman', stand: 'Stand B' },
            { id: 5, name: 'Salad Buah', price: 15000, category: 'Sehat', stand: 'Stand C' },
        ];

        const teachers = [
            { id: 1, name: 'Bpk. Ahmad Fauzi', subject: 'Matematika', status: 'Available' },
            { id: 2, name: 'Ibu Ratna Sari', subject: 'Bahasa Inggris', status: 'Busy' },
            { id: 3, name: 'Bpk. Budi Santoso', subject: 'Fisika', status: 'Available' },
        ];

        // --- Ikon SVG ---
        const Icon = ({ name, className }) => {
            const props = { xmlns: "http://www.w3.org/2000/svg", fill: "none", viewBox: "0 0 24 24", strokeWidth: 1.5, stroke: "currentColor", className: className || "w-6 h-6" };
            switch (name) {
                case 'Beranda': return <svg {...props}><path d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>;
                case 'Absen': return <svg {...props}><path d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" /></svg>;
                case 'Kantin': return <svg {...props}><path d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349m-16.5 11.65V9.35m0 0a3.001 3.001 0 003.75-.615A2.993 2.993 0 009.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 002.25 1.016c.896 0 1.7-.393 2.25-1.016a3.001 3.001 0 003.75.614m-16.5 0a3.004 3.004 0 01-.621-4.72L4.318 3.44A1.5 1.5 0 015.378 3h13.243a1.5 1.5 0 011.06.44l1.19 1.189a3 3 0 01-.621 4.72m-13.5 8.65h3.75a.75.75 0 00.75-.75V13.5a.75.75 0 00-.75-.75H6.75a.75.75 0 00-.75.75v3.75c0 .415.336.75.75.75z" /></svg>;
                case 'Kontak': return <svg {...props}><path d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" /></svg>;
                case 'Settings': return <svg {...props}><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>;
                case 'Logout': return <svg {...props}><path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" /></svg>;
                case 'Save': return <svg {...props}><path d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0113.186 0z" /></svg>;
                case 'Fingerprint': return <svg {...props}><path d="M7.864 4.243A7.5 7.5 0 0119.5 10.5c0 2.92-.556 5.709-1.568 8.262m-7.381-2.044a3.75 3.75 0 011.531-1.127m-2.329 4.179a3.75 3.75 0 01-.659-1.811M10.5 21h3m-6.75-6a6.75 6.75 0 1113.5 0c0 1.22-.26 2.383-.727 3.437" /></svg>;
                case 'Lock': return <svg {...props}><path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" /></svg>;
                case 'Moon': return <svg {...props}><path d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>;
                case 'Back': return <svg {...props}><path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" /></svg>;
                default: return null;
            }
        };

        // --- Halaman Login (Sama) ---
        const LoginView = ({ onLogin }) => {
            const [u, setU] = useState('');
            const [p, setP] = useState('');
            const handle = (e) => {
                e.preventDefault();
                if (u === 'siswa' && p === '123') onLogin({ name: 'Siswa Kelas 11', role: 'Siswa' });
                else alert('Gunakan siswa/123');
            };
            return (
                <div className="min-h-screen flex items-center justify-center bg-blue-50 p-4">
                    <form onSubmit={handle} className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm">
                        <h1 className="text-2xl font-bold text-primary mb-6 text-center">Smaneka Login</h1>
                        <input type="text" placeholder="Username" className="w-full mb-4 p-3 border rounded-xl" onChange={e=>setU(e.target.value)} />
                        <input type="password" placeholder="Password" className="w-full mb-6 p-3 border rounded-xl" onChange={e=>setP(e.target.value)} />
                        <button className="w-full bg-primary text-white py-3 rounded-xl font-bold">Masuk</button>
                    </form>
                </div>
            );
        };

        // --- Halaman Settings (FITUR BARU) ---
        const SettingsView = ({ onBack, isDark, setDark }) => {
            const [budget, setBudget] = useState('1000000');
            const [finger, setFinger] = useState(false);

            return (
                <div className="animate-fade-in pb-10">
                    <div className="flex items-center gap-4 mb-8">
                        <button onClick={onBack} className="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-full transition-colors">
                            <Icon name="Back" className="w-6 h-6" />
                        </button>
                        <h2 className="text-xl font-bold">Pengaturan</h2>
                    </div>

                    <section className="mb-8">
                        <h3 className="text-emerald-500 font-bold text-xs tracking-widest uppercase mb-4">Anggaran Bulanan</h3>
                        <div className="bg-white dark:bg-darkCard p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800">
                            <label className="text-sm text-gray-500 mb-2 block font-medium">Batas Maksimal Pengeluaran (Bulan Ini)</label>
                            <div className="flex gap-2">
                                <input 
                                    type="number" 
                                    value={budget} 
                                    onChange={(e) => setBudget(e.target.value)}
                                    className="flex-grow bg-gray-50 dark:bg-darkBg border border-gray-200 dark:border-gray-700 p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all font-mono"
                                />
                                <button className="bg-orange-500 hover:bg-orange-600 text-white px-6 rounded-xl font-bold flex items-center gap-2 shadow-lg shadow-orange-500/20 active:scale-95 transition-transform">
                                    <Icon name="Save" className="w-5 h-5" /> Simpan
                                </button>
                            </div>
                            <p className="text-xs text-gray-400 mt-3 italic">Aplikasi akan memberi peringatan jika pengeluaran melebihi batas.</p>
                        </div>
                    </section>

                    <section className="mb-8">
                        <h3 className="text-emerald-500 font-bold text-xs tracking-widest uppercase mb-4">Tampilan</h3>
                        <div className="bg-white dark:bg-darkCard p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <Icon name="Moon" className="w-5 h-5 text-gray-400" />
                                <span className="font-medium">Mode Gelap</span>
                            </div>
                            <button 
                                onClick={() => setDark(!isDark)}
                                className={`w-12 h-6 rounded-full transition-colors relative ${isDark ? 'bg-emerald-500' : 'bg-gray-300'}`}
                            >
                                <div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-transform ${isDark ? 'left-7' : 'left-1'}`}></div>
                            </button>
                        </div>
                    </section>

                    <section className="mb-8">
                        <h3 className="text-emerald-500 font-bold text-xs tracking-widest uppercase mb-4">Keamanan & Akun</h3>
                        <div className="bg-white dark:bg-darkCard rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden">
                            <button className="w-full p-4 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-gray-700/30 transition-colors border-b dark:border-gray-700">
                                <div className="flex items-center gap-3 font-medium">
                                    <Icon name="Lock" className="w-5 h-5 text-gray-400" /> Ubah PIN Keamanan
                                </div>
                            </button>
                            <div className="p-4 flex items-center justify-between border-b dark:border-gray-700">
                                <div className="flex items-center gap-3 font-medium">
                                    <Icon name="Fingerprint" className="w-5 h-5 text-gray-400" /> Sidik Jari untuk Login
                                </div>
                                <button 
                                    onClick={() => setFinger(!finger)}
                                    className={`w-12 h-6 rounded-full transition-colors relative ${finger ? 'bg-emerald-500' : 'bg-gray-300'}`}
                                >
                                    <div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-transform ${finger ? 'left-7' : 'left-1'}`}></div>
                                </button>
                            </div>
                            <button className="w-full p-4 flex items-center gap-3 text-orange-500 font-bold hover:bg-orange-50 dark:hover:bg-orange-900/10 transition-colors">
                                <Icon name="Logout" className="w-5 h-5" /> Keluar & Hapus Data
                            </button>
                        </div>
                    </section>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('Beranda');
            const [isDark, setDark] = useState(false);
            const [showSettings, setShowSettings] = useState(false);

            useEffect(() => {
                if (isDark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDark]);

            if (!user) return <LoginView onLogin={setUser} />;

            const renderContent = () => {
                if (showSettings) return <SettingsView onBack={() => setShowSettings(false)} isDark={isDark} setDark={setDark} />;
                
                switch (activeTab) {
                    case 'Beranda': return (
                        <div className="animate-fade-in bg-white dark:bg-darkCard p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800">
                            <h2 className="text-2xl font-bold mb-1">Halo, {user.name}!</h2>
                            <p className="text-gray-600 dark:text-gray-400">Selamat datang di portal Smaneka.</p>
                        </div>
                    );
                    case 'Kantin': return (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 animate-fade-in">
                            {menuItems.map(item => (
                                <div key={item.id} className="bg-white dark:bg-darkCard p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 flex justify-between items-center">
                                    <div><p className="font-bold">{item.name}</p><p className="text-emerald-500 font-mono">Rp {item.price.toLocaleString('id-ID')}</p></div>
                                    <button className="bg-primary text-white px-4 py-2 rounded-xl text-sm font-bold active:scale-95 transition-transform">Pesan</button>
                                </div>
                            ))}
                        </div>
                    );
                    default: return <div className="text-center text-gray-500 mt-20">Fitur {activeTab} segera hadir.</div>;
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen relative pb-20 dark:text-white">
                    <header className="p-4 flex justify-between items-center sticky top-0 bg-blue-50/80 dark:bg-darkBg/80 backdrop-blur-md z-10">
                        <h1 className="text-xl font-bold text-primary">{showSettings ? 'Settings' : activeTab}</h1>
                        <div className="flex gap-2">
                            <button onClick={() => setShowSettings(!showSettings)} className={`p-2 rounded-full transition-colors ${showSettings ? 'bg-primary text-white' : 'text-gray-400 bg-white dark:bg-darkCard shadow-sm'}`}>
                                <Icon name="Settings" />
                            </button>
                        </div>
                    </header>

                    <main className="p-4">{renderContent()}</main>

                    {!showSettings && (
                        <nav className="fixed bottom-0 w-full max-w-md bg-white dark:bg-darkCard border-t dark:border-gray-800 flex justify-around p-3 z-20 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
                            {['Beranda', 'Absen', 'Kantin', 'Kontak'].map((tab) => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`flex flex-col items-center p-2 rounded-lg transition-all ${activeTab === tab ? 'text-primary scale-110' : 'text-gray-400 opacity-60'}`}>
                                    <Icon name={tab} className="w-6 h-6 mb-1" />
                                    <span className="text-[10px] font-bold uppercase tracking-widest">{tab}</span>
                                </button>
                            ))}
                        </nav>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Smooth Dark Mode Transition */
        * { transition: background-color 0.3s ease, border-color 0.3s ease; }
    </style>
</body>
</html>
